<html>

<head>
    <title>
        form
    </title>
</head>

<body>
    <h1 align="center">Create Account</h1>
    <hr>

    <table cellspaing="10" align="center">
        <form action="">
            <tr>
                <td>
                    <label for="">First Name *</label>
                </td>
                <td>
                    <label for="">Last Name </label>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="text" name="" id="" placeholder="enter your first name">
                </td>
                <td>
                    <input type="text" name="" id="" placeholder="enter your last name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Email*</label>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="email" size="59" placeholder="enter your email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Password*</label>
                </td>
                <td>
                    <label for="">Confirm Password*</label>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="password" placeholder="Enter the password">
                </td>
                <td>
                    <input type="password" name="" id="" placeholder="Enter the password again">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Gender</label>
                </td>
                <td>
                    <label for="">Hobbies</label>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="radio" name="g">Male
                    <input type="radio" name="g">Female
                </td>
                <td>
                    <input type="checkbox" name="" id="">Music
                    <input type="checkbox" name="" id="">Sports
                    <input type="checkbox" name="" id="">Travel
                    <input type="checkbox" name="" id="">Movie
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Source of income</label>
                </td>
                <td>
                    <label for="">Income</label>
                </td>
            </tr>
            <tr>
                <td>
                    <select name="" id="">
                        <option value="">Employee</option>
                        <option value="">Student</option>
                        <option value="">Business</option>
                        <option value="">other</option>
                    </select>
                </td>
                <td>
                    <input type="range" name="" id="" min="0" max="1000000" value="200000">
                    <span> <b>20k</b></span>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Upload Profile Picture</label>
                </td>
                <td>
                    <label for="">Age</label>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="file" name="" id="">
                </td>
                <td>
                    <input type="number" name="" id="" value="18">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Bio</label>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <textarea name="" id="" rows="4" cols="70"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="right">
                    <input type="submit" name="" id="" value="Create">
                </td>
            </tr>
        </form>
    </table>
</body>

</html>
